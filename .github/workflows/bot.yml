name: polymarket-sim-bot

on:
  schedule:
    - cron: "*/30 * * * *"   # ciclo a cada 30 min
    - cron: "0 3 * * 1"      # redescoberta toda segunda às 3h UTC
    - cron: "0 8 * * *"      # relatório diário às 9h Portugal
  workflow_dispatch:          # botão manual no GitHub (qualquer momento)

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Se qualified_wallets.json não existe ou está vazio → bootstrap automático
      - name: Bootstrap automático (primeira vez ou lista vazia)
        run: |
          NEEDS_BOOTSTRAP=false
          if [ ! -f "data/qualified_wallets.json" ]; then
            echo "qualified_wallets.json não existe → bootstrap"
            NEEDS_BOOTSTRAP=true
          elif [ "$(python -c "import json; d=json.load(open('data/qualified_wallets.json')); print(len([x for x in d if x.get('qualifies')]))")" = "0" ]; then
            echo "Nenhuma carteira qualificada → bootstrap"
            NEEDS_BOOTSTRAP=true
          fi

          if [ "$NEEDS_BOOTSTRAP" = "true" ]; then
            mkdir -p data
            python main.py discover
            python main.py rank
          fi

      # Relatório diário (só no cron das 8h ou manual)
      - name: Relatório diário
        if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
        run: python report.py --days 1

      # Redescoberta semanal (só na segunda às 3h)
      - name: Redescoberta e ranking semanal
        if: github.event.schedule == '0 3 * * 1'
        run: |
          python main.py discover
          python main.py rank

      # Cycle — roda SEMPRE (a cada 30min, e também após bootstrap/redescoberta)
      - name: Monitorar e copiar trades
        run: python main.py cycle

      # Salvar tudo de volta no repositório
      - name: Salvar estado
        run: |
          git config user.name  "polymarket-bot[actions]"
          git config user.email "bot@users.noreply.github.com"
          git add data/ reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "bot: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

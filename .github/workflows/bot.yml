name: polymarket-sim-bot

on:
  schedule:
    # Ciclo de monitoramento: a cada 30 minutos
    - cron: "*/30 * * * *"
    # Relatório diário: todos os dias às 08h00 UTC (9h Portugal)
    - cron: "0 8 * * *"
    # Descoberta + ranking: toda segunda às 03h00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "Comando a executar"
        required: false
        default: "cycle"
        type: choice
        options:
          - cycle
          - discover
          - rank
          - report
          - full

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Determinar comando
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            echo "command=full" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "command=report" >> $GITHUB_OUTPUT
          else
            echo "command=cycle" >> $GITHUB_OUTPUT
          fi

      - name: Rodar discover
        if: steps.cmd.outputs.command == 'discover' || steps.cmd.outputs.command == 'full'
        run: python main.py discover

      - name: Rodar rank
        if: steps.cmd.outputs.command == 'rank' || steps.cmd.outputs.command == 'full'
        run: python main.py rank

      - name: Rodar cycle
        if: steps.cmd.outputs.command == 'cycle' || steps.cmd.outputs.command == 'full'
        run: python main.py cycle

      - name: Gerar relatório diário
        if: steps.cmd.outputs.command == 'report' || steps.cmd.outputs.command == 'full'
        run: python report.py --days 1

      - name: Salvar estado no repositório
        run: |
          git config user.name  "polymarket-bot[actions]"
          git config user.email "bot@users.noreply.github.com"
          git add data/ reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "bot: atualiza estado $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

name: polymarket-sim-bot

on:
  schedule:
    - cron: "*/30 * * * *"   # ciclo a cada 30 min
    - cron: "0 3 * * 1"      # redescoberta toda segunda às 3h UTC
    - cron: "0 8 * * *"      # relatório diário às 9h Portugal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Bootstrap automático (se não há carteiras qualificadas)
        run: |
          NEEDS=false
          if [ ! -f "data/qualified_wallets.json" ]; then
            NEEDS=true
          else
            COUNT=$(python3 -c "import json; d=json.load(open('data/qualified_wallets.json')); print(sum(1 for x in d if x.get('qualifies')))" 2>/dev/null || echo "0")
            [ "$COUNT" = "0" ] && NEEDS=true
          fi
          if [ "$NEEDS" = "true" ]; then
            echo "Bootstrap: a descobrir e qualificar carteiras..."
            mkdir -p data
            python main.py discover
            python main.py rank
          fi

      - name: Relatório diário
        if: github.event.schedule == '0 8 * * *'
        run: python report.py --days 1

      - name: Redescoberta semanal
        if: github.event.schedule == '0 3 * * 1'
        run: |
          python main.py discover
          python main.py rank

      - name: Ciclo de monitoramento
        run: python main.py cycle

      - name: Salvar estado
        run: |
          git config user.name  "polymarket-bot[actions]"
          git config user.email "bot@users.noreply.github.com"
          git add data/ reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "bot: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

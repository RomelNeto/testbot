name: polymarket-sim-bot

# Roda o bot automaticamente na nuvem do GitHub -- seu PC pode ficar
# desligado. Dois gatilhos:
#   1. "cycle": a cada 30 minutos, verifica trades novos das carteiras
#      qualificadas e simula copy trading.
#   2. "discover" + "rank": uma vez por semana, redescobre carteiras
#      candidatas e reavalia os filtros de qualidade.
# O estado (data/*.json, data/trade_log.csv) e commitado de volta no
# repositorio a cada execucao, entao o bot "lembra" o progresso entre rodadas.

on:
  schedule:
    - cron: "*/30 * * * *"   # ciclo de monitoramento, a cada 30 min
    - cron: "0 3 * * 1"      # descoberta + ranking, toda segunda 03:00 UTC
  workflow_dispatch: {}       # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descoberta + ranking semanal
        if: github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          python main.py discover
          python main.py rank

      - name: Ciclo de monitoramento
        if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
        run: python main.py cycle

      - name: Gerar relatorio semanal (as segundas ou manual)
        if: github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch'
        run: python report.py --days 7

      - name: Salvar estado no repositorio
        run: |
          git config user.name "polymarket-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/ || true
          git diff --cached --quiet || git commit -m "bot: atualiza estado da simulacao [skip ci]"
          git push

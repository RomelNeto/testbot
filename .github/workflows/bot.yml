name: polymarket-sim-bot

on:
  schedule:
    - cron: "*/30 * * * *"   # ciclo a cada 30 min
    - cron: "0 3 * * 1"      # redescoberta toda segunda às 3h UTC
    - cron: "0 8 * * *"      # relatório diário às 9h Portugal
  workflow_dispatch:
    inputs:
      command:
        description: "Comando manual (deixa 'cycle' para o funcionamento normal; escolhe 'reset' para limpar a simulação, ex.: depois de um bug corrigido)"
        required: false
        default: "cycle"
        type: choice
        options:
          - cycle
          - reset
          - discover

permissions:
  contents: write

# FIX v7 -- BUG REAL CORRIGIDO ("nenhuma posição fecha"): há 3 agendamentos
# cron diferentes e nenhuma proteção contra execuções sobrepostas. Se um
# ciclo demorar mais que o intervalo até o próximo trigger (ex.: mais lento
# depois de mudanças no código, ou API do Polymarket mais lenta), o próximo
# run começa por cima do anterior -- ambos leem/escrevem data/ ao mesmo
# tempo, e normalmente só um consegue dar commit/push (o outro falha ou
# sobrescreve). De fora isso parece "nada está a fechar", porque runs
# nunca terminam de forma limpa. `concurrency` faz o próximo run esperar
# o atual terminar em vez de correr em paralelo com ele.
concurrency:
  group: polymarket-sim-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Bootstrap automático (se não há carteiras qualificadas)
        if: github.event.inputs.command != 'reset'
        run: |
          NEEDS=false
          if [ ! -f "data/qualified_wallets.json" ]; then
            NEEDS=true
          else
            COUNT=$(python3 -c "import json; d=json.load(open('data/qualified_wallets.json')); print(sum(1 for x in d if x.get('qualifies')))" 2>/dev/null || echo "0")
            [ "$COUNT" = "0" ] && NEEDS=true
          fi
          if [ "$NEEDS" = "true" ]; then
            echo "Bootstrap: a descobrir e qualificar carteiras..."
            mkdir -p data
            python main.py discover
            python main.py rank
          fi

      - name: Relatório diário
        if: github.event.schedule == '0 8 * * *'
        run: python report.py --days 1

      - name: Redescoberta semanal
        if: github.event.schedule == '0 3 * * 1'
        run: |
          python main.py discover
          python main.py rank

      - name: Executar comando (ciclo normal, ou reset/discover manual)
        run: |
          CMD="${{ github.event.inputs.command || 'cycle' }}"
          echo "A executar: python main.py $CMD"
          python main.py "$CMD"

      - name: Salvar estado
        run: |
          git config user.name  "polymarket-bot[actions]"
          git config user.email "bot@users.noreply.github.com"
          git add data/ reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "bot: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
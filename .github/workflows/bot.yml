name: polymarket-sim-bot

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descoberta + ranking semanal
        if: github.event.schedule == '0 3 * * 1'
        run: |
          python main.py discover
          python main.py rank

      - name: Ciclo de monitoramento
        if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
        run: python main.py cycle

      - name: Gerar relatorio semanal (as segundas)
        if: github.event.schedule == '0 3 * * 1'
        run: python report.py --days 7

      - name: Salvar estado no repositorio
        run: |
          git config user.name "polymarket-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/ || true
          git diff --cached --quiet || git commit -m "bot: atualiza estado da simulacao [skip ci]"
          git push
